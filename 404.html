<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷失在时空中 · 平行时空影业</title>
  <link rel="icon" href="/uuuuz.github.io/favicon.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: #05060f radial-gradient(ellipse at center, #1a1240, #05060f 70%);
      color: #eef1ff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(72px, 20vw, 140px);
      background: linear-gradient(110deg, #5ee7ff, #9b7bff 50%, #ff6fb5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #a9b0d6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .15);
      color: #eef1ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这个页面掉进了另一个平行时空。</p>
    <a href="/uuuuz.github.io/">回到首页</a>
  </main>

</html>
